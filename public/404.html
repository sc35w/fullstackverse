<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <!--
      GitHub Pages has no server-side rewrites, so a deep link like
      /fullstackverse/about hits this 404 page. We stash the intended
      path and redirect to the app's index.html, which restores it via
      history.replaceState (see the inline script in index.html).
      Technique: https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      var basePath = '/fullstackverse';
      var path = location.pathname.slice(basePath.length) + location.search + location.hash;
      sessionStorage.setItem('spa-redirect-path', path);
      location.replace(basePath + '/');
    </script>
  </head>
  <body></body>
</html>
